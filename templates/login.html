{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/login.css' %}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Login Page</title>
</head>

<body>

    <header>
        <a href="/" class="logo">
            <img src="{% static 'Pics/book.svg' %}" alt="Weblogo">
            <span style="color: #0f172a;">Libraria</span>
        </a>
    
        <nav id="navbar">
            <a href="/">Home</a>
            <a href="/viewbooks/">Books</a>
            <a href="/login/" class="button">Login</a>
            <a href="/signup/" class="button">SignUp</a>
        </nav>
    </header>

    <main>
        <h1>Welcome Back</h1>
        <p>Sign in to your library account</p>

        {% if messages %}
            {% for message in messages %}
                <p style="color:red;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form action="/login/" method="post">
            {% csrf_token %}
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="inputs">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
                <i class="fa-solid fa-eye" style="color: rgb(228, 220, 183);" id="togglePass"></i>
            </div>

            <div>
                <button type="submit">Log In</button>
            </div>
        </form>

        <div>
            <p>Don't have an account? <a href="/signup/">Sign up</a></p>
        </div>
    </main>

    <script src="{% static 'js/login.js' %}"></script>
</body>

</html>
