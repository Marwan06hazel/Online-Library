<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="../css/Profile.css">
</head>

<body>

    <header>
        <a href="/" class="logo">
            <img src="../Pics/book.svg">
            <span style="color: #0f172a; ">Libraria</span>
        </a>

        <nav id="navbar">
            <a href="Profile.html">My Profile</a>
            <a id="homeLink" href="#">Home</a>
            <a href="../index.html" class="button" onclick="logout()">Log out</a>
        </nav>
    </header>

    <h1>My Profile</h1>

    <div class="profile-container">

        <div class="profile-header">

            <img id="profileImage" src="../Pics/Profile-icon.png">
            <h2 id="username"></h2>
            <p id="email"></p>

            <span id="role" class="role-badge"></span>

            <div class="profile-actions">
                <div class="action-buttons">
                    <button onclick="openEdit()">Edit Profile</button>
                    <button onclick="logout()">Logout</button>
                </div>
            </div>

        </div>

    </div>


    <!-- ACCOUNT INFO -->
    <div class="profile-info">
        <h3>Account Info</h3>

        <p><strong>Username:</strong> <span id="infoUsername"></span></p>
        <p><strong>Email:</strong> <span id="infoEmail"></span></p>
        <p><strong>Role:</strong> <span id="infoRole"></span></p>
    </div>


    <!-- EDIT BOX -->
    <div class="edit-profile" id="editBox">
      <div>
        <h3>Edit Profile</h3>

        <label>Name</label>
        <input type="text" id="nameInput">

        <label>Email</label>
        <input type="email" id="emailInput">

        <label>Password</label>
        <input type="password" id="passInput">

        <label>Profile Image</label>
        <input type="file" id="imgInput">

        <button onclick="saveChanges()">Save</button>
        <button onclick="closeEdit()">Cancel</button>
       </div>
    </div>

    <script src="../js/Profile.js"></script>
    <script src="../js/logout.js"></script>
</body>
</html>
