<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="author" content="Marwan">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Library</title>
</head>

<body>

    <header>
        <a href="/" class="logo">
            <img src="../book.svg" alt="Weblogo">
        </a>

        <nav id="navbar">
            <a href="adminpage.html">Home</a>
            <a href="viewbooks.html">Books</a>
            <a href="addbook.html">Add Book</a>
            <a href="manage-books.html">Manage Books</a>
            <a href="../index.html" class="button">Log out</a>
        </nav>
    </header>

    <main>
        <h1>Borrow Book</h1>
        <p>Fill out the form below to borrow this book.</p>

        <figure class="book-cover">
            <img src="Pics/The summer i turend pretty (Cover Page}.jpg"
                 alt="Book cover of The Summer I Turned Pretty by Jenny Han"
                 width="100" height="150" />

            <figcaption class="book-details">
                <b>The Summer I turned pretty [Book Title]</b>
                <p>by Jenny Han [Book Author]</p>
                <p style="color: #d97706;">Romance [Book Genre]</p>
            </figcaption>
        </figure>

        <form action="" method="post">

            <!-- Duration -->
            <section class="duration">
                <p><b><big>Borrow Duration</big></b></p>
                <p>For how long would you like to borrow this book?</p>

                <input type="number" id="duration" name="duration" min="1" step="1"
                       placeholder="Enter Duration..." required>

                <select id="duration-unit" name="duration_unit">
                    <option value="days" selected>Days</option>
                    <option value="weeks">Weeks</option>
                    <option value="months">Months</option>
                </select>

                <p>Due date: [date]</p>
            </section>

            <!-- Payment Method -->
            <section class="payment">
                <p><b><big>Payment Method</big></b></p>
                <p>Select how you'd like to pay</p>

                <select id="payment-method" name="payment_method" required>
                    <option value="cash">Cash on Delivery</option>
                    <option value="online_wallet" selected>Online Wallet</option>
                    <option value="credit_card">Credit Card</option>
                    <option value="debit_card">Debit Card</option>
                </select>
            </section>

            <!-- Delivery Address -->
            <section class="delivery-add">
                <p><b><big>Delivery Address</big></b></p>
                <p>Where would you like your book delivered?</p>

                <textarea id="delivery-address" name="delivery_address"
                          placeholder="Enter your full address..."
                          cols="30" rows="4" required></textarea>
            </section>

            <!-- Submit Button -->
            <section class="borrow-btn">
                <button type="submit">Confirm & Borrow</button>
            </section>

        </form>
    </main>

</body>
</html>
