<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
</head>

<body>

    <header>
        <a href="/" class="logo">
            <img src="../book.svg" alt="Weblogo">
        </a>

        <nav id="navbar">
            <a href="adminpage.html">Home</a>
            <a href="viewbooks.html">Books</a>
            <a href="addbook.html">Add Book</a>
            <a href="managebooks.html">Manage Books</a>
            <a href="../index.html" class="button">Log out</a>
        </nav>
    </header>

    <h1>Add New Book</h1>

    <form>
        <p><strong>Book Title</strong></p>
        <input type="text" placeholder="Enter book title">

        <p><strong>Author</strong></p>
        <input type="text" placeholder="Author name">

        <p><strong>Category</strong></p>
        <input type="text" placeholder="e.g. Fiction, Science, History">

        <p><strong>Description</strong></p>
        <textarea rows="4" cols="50" placeholder="Brief book description..."></textarea>

        <br><br>
        <button type="button">Add Book</button>
    </form>
</body>

</html>
