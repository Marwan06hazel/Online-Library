<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link rel="stylesheet" href="../css/Manage_Books_Page.css" />
</head>

<body>

    <header>
        <a href="/" class="logo">
            <img src="../Pics/book.svg" alt="Weblogo">
            <span style="color: #0f172a; ">Libraria</span>
        </a>

        <nav id="navbar">
            <a href="adminpage.html">Home</a>
            <a href="viewbooks.html">Books</a>
            <a href="addbook.html">Add Book</a>
            <a href="../index.html" class="button" onclick="logout()">Log out</a>
        </nav>
    </header>

    <main>
        <button type="button" class="Back-Btn" onclick="history.back()">← Go Back</button>
        <h1>Edit Book</h1>
        <p>Select a book to edit its details.</p>

        <form>

            <figure class="edit-book-cover">
                <b>Book Cover</b>

                <img class="edit-book-cover-pic"
                     src=""
                     alt="Book cover"
                     width="100" height="150" />

                <button type="button" class="Remove-Btn" onclick="triggerNewImage()">Remove & Upload</button>
            </figure>

            <section class="edit-details">
                <b>Title *</b><br />
                <input type="text" name="edit-title" required>

                <br /><br />

                <b>Author *</b><br />
                <input type="text" name="edit-author" required>

                <br /><br />

                <div class="Id-cat">
                    <b>ID</b><br />
                    <input class="id-input" type="text" name="edit-ID">

                    <br /><br />

                    <b class="cat-txt">Category</b><br />
                    <select class="cat-select" name="edit_genre">
                        <option value="All">All Categories</option>
                        <option value="Romance">Romance</option>
                        <option value="Science">Science</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Nonfiction">Non-Fiction</option>
                        <option value="Mystery">Mystery</option>
                        <option value="Thriller">Thriller</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Horror">Horror</option>
                        <option value="Biography">Biography</option>
                        <option value="History">History</option>
                        <option value="Poetry">Poetry</option>
                        <option value="Selfhelp">Self-Help</option>
                        <option value="Philosophy">Philosophy</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Children">Children's</option>
                        <option value="Youngadult">Young Adult</option>
                        <option value="Comics">Comics / Graphic Novels</option>
                        <option value="Religion">Religion / Spirituality</option>
                        <option value="Sciencefiction">Science Fiction</option>
                        <option value="Travel">Travel</option>
                        <option value="Cookbook">Cookbook</option>
                        <option value="Art">Art / Photography</option>
                        <option value="Health">Health / Fitness</option>
                    </select>
                </div>

                <br /><br />

                <b>Description</b><br />
                <textarea name="edit-description" cols="30"></textarea>
            </section>

            <br /><br />

            <section class="edit-publish-details">
                <div class="copies">
                    <div class="copy-item">
                        <b>Total Copies</b>
                        <input type="number" name="edit-copies">
                    </div>
                    <div class="copy-item">
                        <b>Available Copies</b>
                        <input type="number" name="edit-available-copies">
                    </div>
                </div>

                <div class="dates">
                    <div class="date-item">
                        <b>Publisher</b>
                        <input type="text" name="edit-publisher">
                    </div>
                    <div class="date-item">
                        <b>Year</b>
                        <input type="text" name="edit-date">
                    </div>
                    <div class="date-item">
                        <b>Pages</b>
                        <input type="number" name="edit-pages-num">
                    </div>
                </div>
            </section>

            <br /><br />

            <section>
                <button class="Edit-btn" type="button">Save Changes</button>
            </section>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 All rights reserved.</p>
    </footer>

    <script src="../js/managebooks.js"></script>
</body>
</html>
