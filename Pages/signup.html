<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>SignUp Page</title>
</head>

<body>

    <header>
        <a href="/" class="logo">
            <img src="../book.svg" alt="Weblogo">
            <span>Libraria</span>
        </a>
        
        <nav id="navbar">
            <a href="../index.html">Home</a>
            <a href="viewbooks.html">Books</a>
            <a href="login.html" class="button">Login</a>
            <a href="signup.html" class="button">SignUp</a>
        </nav>
    </header>

    <main class="signup">

        <h2>Create an Account</h2>

        <form action="#" method="post">
            <div class="inputs">
                <label for="username">Username</label>
                <input type="text" id="username" name="username">
            </div>
        
            <div class="inputs">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
        
            <div class="inputs">
                <label for="password">Password</label> 

                <div class="input-box"> <!-- separating them to be realtive to each other's position -->
                    <input type="password" id="password" name="password">
                    <i class="fa-solid fa-eye" style="color: rgb(228, 220, 183);" id="togglePass"></i>
                </div>
            </div>
        
            <div class="inputs">
                <label for="confirm_password">Confirm Password</label>

                <div class="input-box">  
                    <input type="password" id="confirm" name="confirm">
                    <i class="fa-solid fa-eye" style="color: rgb(228, 220, 183);" id="toggleConfirm"></i>
                </div>
            </div>
        
            <div class="box">
                <label for="admin">
                <input type="checkbox" id="admin" name="admin">  Register as Admin
                </label>
            </div>
        
            <div class="but1">
                <button type="submit">Sign Up</button>
            </div>
        </form>
        
        <div class="footer">
            <p>Already have an account? <a href="login.html">Log in</a></p>
        </div>

    </main>
    <script src="../js/signup.js"></script>
</body>

</html>
